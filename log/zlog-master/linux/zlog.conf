# 全局配置部分
# 配置日志系统的全局参数
[global]
# 严格初始化模式，确保日志系统正确初始化
strict init = true
# 设置日志缓冲区的最小大小为1024字节
buffer min = 1024
# 设置日志缓冲区的最大大小为2MB
buffer max = 2MB
# 指定日志轮转时使用的锁文件路径
rotate lock file = /tmp/zlog.lock

# 日志格式定义部分
# 定义不同类型的日志输出格式模板
[formats]
# 简单格式：仅包含消息内容和换行符
simple = "%m%n"
# 详细格式：包含时间戳、日志级别、文件名、行号和消息内容
detailed = "%d(%Y-%m-%d %H:%M:%S) %V [%p:%F:%L] %m%n"
# JSON格式：以JSON结构输出时间、级别、文件、行号和消息信息
json = "{'time':'%d(%Y-%m-%d %H:%M:%S)','level':'%V','file':'%F','line':%L,'message':'%m'}%n"

# 日志路由规则部分
# 定义日志的路由和处理规则
[rules]
# 默认规则：所有日志输出到标准输出，使用简单格式
# FATAL级别日志：输出到标准错误，使用详细格式
#*.FATAL        >stdout; simple
# ERROR级别日志：输出到标准错误，使用详细格式
#*.ERROR        >stdout; simple
# # WARN级别日志：输出到标准输出，使用详细格式
#*.WARN         >stdout; simple
# # NOTICE级别日志：输出到标准输出，使用详细格式
# *.NOTICE       >stdout; simple
# # INFO级别日志：输出到文件，使用JSON格式
# *.INFO         >stdout; simple
# # INFO级别日志：输出到文件，使用JSON格式
 *.DEBUG         >stdout; simple

# # 将所有DEBUG及以上级别的日志输出到标准输出，使用simple格式
# *.*            >stdout; simple
# # my_cat分类的DEBUG级别日志输出到标准输出，使用简单格式
# my_cat.DEBUG    >stdout; simple

# # my_cat分类的INFO级别日志输出到文件，文件大小限制1MB，最多保留5个文件，使用JSON格式
my_cat.INFO    "./my_app.log", 1MB * 5; json
